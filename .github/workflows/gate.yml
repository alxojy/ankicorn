name: gate

on:
  push:
  pull_request:

# Non-blocking backstop: agents never wait for this run (see CLAUDE.md).
# Until the Xcode project exists the gate only needs Node and Rust, so it runs on Linux. When app/*.xcodeproj
# lands, the orchestrator switches `runs-on` to a macOS runner so verify can run xcodebuild.
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Gate
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="origin/main"
          fi
          node tools/gate.mjs --base "$BASE" --full
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
