name: Cornhub
options:
  bundleIdPrefix: com.alxojy
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf
    from: 1.39.0
targets:
  Cornhub:
    type: application
    platform: iOS
    sources:
      - path: Cornhub
        excludes:
          - Resources/AnkiWeb
      # Anki's built web pages (scripts/build-web.sh), bundled as a folder; absent until built.
      - path: Cornhub/Resources/AnkiWeb
        type: folder
        optional: true
    info:
      path: Cornhub/Info.plist
      properties:
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Anki deck package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.alxojy.cornhub.apkg]
          - CFBundleTypeName: Anki collection package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.alxojy.cornhub.colpkg]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.alxojy.cornhub.apkg
            UTTypeDescription: Anki deck package
            UTTypeConformsTo: [public.data, public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [apkg]
          - UTTypeIdentifier: com.alxojy.cornhub.colpkg
            UTTypeDescription: Anki collection package
            UTTypeConformsTo: [public.data, public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [colpkg]
    dependencies:
      - framework: ../build/RslibBridge.xcframework
        embed: false
      - package: SwiftProtobuf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alxojy.cornhub
        PRODUCT_NAME: Cornhub
        INFOPLIST_KEY_CFBundleDisplayName: Cornhub
        INFOPLIST_KEY_NSCameraUsageDescription: Cornhub uses the camera to add pictures to your cards.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Cornhub records audio for your cards.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        OTHER_LDFLAGS: "-lc++ -lresolv"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  CornhubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CornhubTests
    dependencies:
      - target: Cornhub
      - package: SwiftProtobuf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alxojy.cornhub.tests
        GENERATE_INFOPLIST_FILE: YES
  CornhubUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CornhubUITests
    dependencies:
      - target: Cornhub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alxojy.cornhub.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cornhub:
    build:
      targets:
        Cornhub: all
        CornhubTests: [test]
        CornhubUITests: [test]
    test:
      targets:
        - CornhubTests
        - CornhubUITests
